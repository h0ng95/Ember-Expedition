<!doctype html><html lang="ko"><meta charset="utf-8"><title>보스 체감 크기 비교</title><style>body{background:#101722;color:#dfebf3;font:16px system-ui;margin:0;padding:24px}h1{font-size:24px}p{color:#b4c6d2}#cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card{background:#263541;border:1px solid #4e6473;border-radius:8px;overflow:hidden}h2{font-size:17px;margin:16px}canvas{width:100%;display:block}button{padding:10px 20px;margin:8px}</style><h1>5전투 보스의 몸통과 체감 크기 기준</h1><p>동일한 축척으로 비교. 5전투는 유지한다. 서리는 새 부유형 디자인이며 버튼은 크기만 비교한다.</p><button onclick="after=false;drawAll()">변경 전</button><button onclick="after=true;drawAll()">조정 후</button><span id="mode"></span><div id="cards"></div><script src="frost-full-motion.js"></script><script>const data=[{"name":"5 · 잿갈기","before":244,"after":244,"id":"forest-boss","path":"../../unity/Assets/Resources/Art/Enemies/v019/forest-boss.png","frame":{"x":46,"y":88,"w":195,"h":150},"anchor":142.75,"ref":150},{"name":"10 · 성문 골렘","before":244,"after":266,"id":"castle-boss","path":"../../unity/Assets/Resources/Art/Enemies/v021/castle-boss.png","frame":{"x":33,"y":58,"w":200,"h":179},"anchor":132,"ref":179},{"name":"15 · 용광로","before":244,"after":280,"id":"furnace-boss","path":"../../unity/Assets/Resources/Art/Enemies/v024/furnace-boss.png","frame":{"x":19,"y":30,"w":219,"h":206},"anchor":129.75,"ref":206},{"name":"20 · 서리 파수꾼 · 재디자인","before":244,"after":290,"id":"frost-boss","path":"../../unity/Assets/Resources/Art/Enemies/v039/frost-boss-floating.png","frame":{"x":44,"y":59,"w":1249,"h":1079},"anchor":668.5,"ref":1079},{"name":"25 · 가시 군주","before":250,"after":340,"id":"garden-boss","path":"../../unity/Assets/Resources/Art/Enemies/v030/garden-boss.png","frame":{"x":52,"y":42,"w":150,"h":197},"anchor":128.75,"ref":197},{"name":"30 · 수호룡","before":300,"after":340,"id":"palace-boss","path":"../../unity/Assets/Resources/Art/Enemies/v031/palace-boss.png","frame":{"x":34,"y":56,"w":221,"h":184},"anchor":131,"ref":184}];let after=true;const items=[];data.forEach(d=>{const el=document.createElement('section');el.className='card';el.innerHTML='<h2>'+d.name+'</h2><canvas width="420" height="420"></canvas>';document.getElementById('cards').append(el);const im=new Image();const entry={d,im,c:el.querySelector('canvas').getContext('2d')};items.push(entry);im.onload=()=>drawAll();im.src=d.path;});function drawAll(){document.getElementById('mode').textContent=after?'조정 후':'변경 전';items.forEach(({d,im,c})=>{c.clearRect(0,0,420,420);c.fillStyle='#83949e';c.fillRect(12,385,396,1);if(im.complete&&im.naturalWidth){const h=after?d.after:d.before,s=h/d.ref,f=d.frame;if(d.id==='frost-boss'){FrostFullMotion.render(c,210,385,h,0,0);c.fillStyle='#d3e6f2';c.font='14px system-ui';c.fillText(h+' · 전신 재디자인',18,30);return;}c.imageSmoothingEnabled=false;c.drawImage(im,f.x,f.y,f.w,f.h,(420-f.w*s)/2,385-f.h*s-(d.id==='frost-boss'?10:0),f.w*s,f.h*s);c.fillStyle='#d3e6f2';c.font='14px system-ui';c.fillText(h+' / '+d.before+' · '+(d.id==='frost-boss'?'새 실루엣':(after?Math.round((d.after/d.before-1)*100):0)+'%'),18,30);}})}FrostFullMotion.image.addEventListener('load',drawAll);window.ready=()=>items.every(x=>x.im.complete&&x.im.naturalWidth);</script></html>
