<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서리의 파수꾼 · 첫 프레임 관절 보행 실험</title>
<style>
  *{box-sizing:border-box}body{margin:0;background:#101722;color:#e6edf4;font:15px/1.55 system-ui}
  main{max-width:1180px;margin:24px auto;padding:16px}h1{font-size:24px;margin:4px 0 8px}
  p{color:#b7c6d4;margin:5px 0 15px}.eyebrow{color:#9ecbdc;font-size:12px;letter-spacing:2px}
  .views{display:grid;grid-template-columns:1fr 1fr;gap:14px}.view{background:#1a2733;border:1px solid #536575;border-radius:10px;overflow:hidden}
  .view label{display:block;padding:7px 13px;background:#263744;color:#d6e3ec}canvas{width:100%;height:auto;display:block;image-rendering:pixelated}
  .controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}button{padding:9px 17px;color:#e9f2f5;background:#345163;border:1px solid #87a6b7;border-radius:5px;cursor:pointer}
  input[type=range]{width:240px}small{color:#9fb1c2}.note{margin-top:14px;color:#e7c891}
  @media(max-width:800px){.views{grid-template-columns:1fr}}
</style>
<main>
  <div class="eyebrow">IGNIS · FROST WARDEN · LOCAL CANVAS PROTOTYPE</div>
  <h1>승인된 원본 첫 프레임으로 관절 보행 시험</h1>
  <p>같은 PNG의 첫 칸만 잘라 그립니다. 왼쪽은 원본, 오른쪽은 먼 다리 → 몸통과 망토 → 가까운 다리 순서로 그리는 실험입니다. PNG와 Unity 코드는 바꾸지 않았습니다.</p>
  <div class="views"><div class="view"><label>원본 첫 프레임</label><canvas id="original" width="512" height="490"></canvas></div>
    <div class="view"><label>2D 관절 보행 · 8 fps 상당</label><canvas id="rig" width="512" height="490"></canvas></div></div>
  <div class="controls"><button id="pause">멈추기</button><label>걸음 위치 <input id="phase" type="range" min="0" max="100" value="0"></label><label>보폭 <input id="stride" type="range" min="15" max="43" value="40"></label><button id="masks">절단 영역 보기</button><small>발 기준선 y468 · 머리/몸통 고정 · 지면 그림자 고정</small></div>
  <p class="note">절단선이나 투명한 틈이 눈에 띄면 이 시안은 Unity에 적용하지 않습니다. 특히 천이 다리를 가리는 부분과 무릎 연결을 확인해 주세요.</p>
</main>
<script>
(() => {
  const source = new Image();
  source.src = '../../unity/Assets/Resources/Art/Enemies/v039/frost-boss-walk.png';
  const original = document.getElementById('original').getContext('2d');
  const rig = document.getElementById('rig').getContext('2d');
  const phaseSlider = document.getElementById('phase');
  const strideSlider = document.getElementById('stride');
  let running = true, showMasks = false, elapsed = 0, last = 0;
  const W=512,H=490;
  // Pixel coordinates refer only to the approved first 512 x 490 cell.
  const parts = [
    {name:'farThigh', poly:[[246,281],[292,297],[340,338],[352,376],[307,383],[264,352],[232,319]], pivot:[255,290]},
    {name:'farShin', poly:[[302,351],[361,354],[384,409],[410,448],[409,472],[290,474],[276,434],[284,393]], pivot:[319,365]},
    {name:'nearThigh',poly:[[151,279],[205,279],[244,304],[224,342],[193,374],[146,350],[136,315]],pivot:[200,285]},
    {name:'nearShin', poly:[[149,331],[211,340],[206,399],[185,429],[202,468],[61,471],[57,442],[118,407],[132,363]],pivot:[185,335]},
  ];
  function polygon(ctx, points){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath()}
  function makeLayer(poly){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(source,0,0,W,H,0,0,W,H);x.globalCompositeOperation='destination-in';polygon(x,poly);x.fill();x.globalCompositeOperation='source-over';return c}
  function makeBody(){const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.imageSmoothingEnabled=false;x.drawImage(source,0,0,W,H,0,0,W,H);x.globalCompositeOperation='destination-out';for(const part of parts){polygon(x,part.poly);x.fill()}x.globalCompositeOperation='source-over';return c}
  let body, layers;
  source.onload=()=>{body=makeBody();layers=Object.fromEntries(parts.map(p=>[p.name,makeLayer(p.poly)]))};
  function stage(ctx){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#223240');g.addColorStop(1,'#344651');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(8,13,19,.38)';ctx.beginPath();ctx.ellipse(250,467,191,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#738b96';ctx.fillRect(22,469,468,1);ctx.imageSmoothingEnabled=false}
  function drawLeg(ctx,upper,lower,hip,knee,hipAngle,kneeAngle,dy=0){
    ctx.save();ctx.translate(0,dy);ctx.translate(hip[0],hip[1]);ctx.rotate(hipAngle);ctx.translate(-hip[0],-hip[1]);
    ctx.drawImage(layers[upper],0,0);
    ctx.translate(knee[0],knee[1]);ctx.rotate(kneeAngle);ctx.translate(-knee[0],-knee[1]);
    ctx.drawImage(layers[lower],0,0);ctx.restore();
  }
  function draw(now){if(running)elapsed+=Math.min(50,now-last);last=now;
    const t=running?elapsed/750:(Number(phaseSlider.value)/100),p=(t%1)*Math.PI*2;
    if(running)phaseSlider.value=String(Math.round(((t%1)+1)%1*100));
    stage(original);stage(rig);
    if(source.complete&&source.naturalWidth){original.drawImage(source,0,0,W,H,0,0,W,H);
      if(body&&layers){
        // The authored feet are already widely spaced. Move one leg at a time
        // toward a crossed stance; rotating outward lifts both feet unnaturally.
        const nearStep=(1+Math.sin(p))*.5;
        const farStep=(1+Math.sin(p-Math.PI/2))*.5;
        const amplitude=Number(strideSlider.value);
        const farHip=(amplitude*.72*farStep)*Math.PI/180;
        const nearHip=(-amplitude*nearStep)*Math.PI/180;
        const farKnee=(3*farStep)*Math.PI/180;
        const nearKnee=(-3*nearStep)*Math.PI/180;
        drawLeg(rig,'farThigh','farShin',[255,290],[319,365],farHip,farKnee,-7*farStep);
        rig.drawImage(body,0,0);
        drawLeg(rig,'nearThigh','nearShin',[200,285],[185,335],nearHip,nearKnee);
        if(showMasks){rig.save();rig.lineWidth=2;for(const [i,part] of parts.entries()){rig.strokeStyle=['#72d6f0','#5af0ad','#ffd267','#ff8c83'][i];polygon(rig,part.poly);rig.stroke();rig.fillStyle=rig.strokeStyle;rig.fillRect(part.pivot[0]-3,part.pivot[1]-3,6,6)}rig.restore()}
      }
    }
    requestAnimationFrame(draw)
  }
  document.getElementById('pause').onclick=e=>{running=!running;e.target.textContent=running?'멈추기':'재생'};
  document.getElementById('masks').onclick=e=>{showMasks=!showMasks;e.target.textContent=showMasks?'절단 영역 숨기기':'절단 영역 보기'};
  phaseSlider.oninput=()=>{running=false;document.getElementById('pause').textContent='재생'};
  requestAnimationFrame(draw);
})();
</script>
</html>
