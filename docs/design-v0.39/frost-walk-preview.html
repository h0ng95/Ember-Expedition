<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>서리의 파수꾼 · 선택한 보행 시안</title><style>*{box-sizing:border-box}body{background:#111722;color:#e5e9ed;font:16px/1.7 system-ui;margin:0}main{max-width:960px;margin:40px auto;padding:24px}h1{margin:6px 0;font-size:28px}.tag{color:#8cc4e0;font-size:12px;letter-spacing:2px}p{color:#aebbc8}canvas{width:100%;display:block;background:radial-gradient(ellipse at 50% 80%,#35424d,#19222e 70%);border:1px solid #4b5a69;border-radius:12px}button{background:#304455;color:#e6f3ff;border:1px solid #6b96b7;border-radius:6px;padding:12px 18px;cursor:pointer}a{color:#c5d9e8}.buttons{display:flex;gap:12px;align-items:center;margin-top:18px;flex-wrap:wrap}</style><main><div class="tag">IGNIS · FROST WARDEN</div><h1>이전 보행 시안 · 보관용</h1><p><a href="frost-walk-remake.html">→ 부유형 갑주와 공격 모션 최신 디자인 보기</a></p><p>회색 갑옷·짙은 남색 천·옅은 얼음빛. 사용자가 첨부한 시안의 원본 6프레임을 그대로 사용하며 발 접지와 몸체 기준 크기를 맞춘다. 아래는 미완성 보행 시안이다. 같은 쪽 다리가 앞서는 자세가 반복되어 양발 교차가 부족하다. 게임에는 적용하지 않았다.</p><canvas id="c" width="900" height="420"></canvas><div class="buttons"><button id="play">멈추기</button><button id="step">다음 프레임</button><a href="HANDOFF.html">개발 기록</a></div></main><script>
const frames=[{x:32,y:9,w:421,h:459,foot:468},{x:550,y:9,w:439,h:459,foot:468},{x:1078,y:14,w:416,h:451,foot:465},{x:35,y:509,w:429,h:452,foot:961},{x:546,y:513,w:419,h:448,foot:961},{x:1075,y:513,w:414,h:446,foot:959}];const im=new Image();im.src='../../unity/Assets/Resources/Art/Enemies/v039/frost-boss-walk.png';const c=document.getElementById('c').getContext('2d');let paused=false,t=0,last=0,index=0;document.getElementById('play').onclick=e=>{paused=!paused;e.target.textContent=paused?'재생':'멈추기'};document.getElementById('step').onclick=()=>{paused=true;index=(index+1)%6;t=index*125;document.getElementById('play').textContent='재생'};
function draw(now){if(!paused)t+=Math.min(50,now-last);last=now;index=Math.floor(t/125)%6;c.clearRect(0,0,900,420);c.fillStyle='#4e626f';c.fillRect(100,350,700,1);if(im.complete&&im.naturalWidth){const f=frames[index],s=244/459;const x=450+(f.x-index%3*512-230)*s,y=350-(f.foot-f.y)*s;c.imageSmoothingEnabled=false;c.drawImage(im,f.x,f.y,f.w,f.h,x,y,f.w*s,f.h*s)}c.fillStyle='#a5b8c9';c.font='14px system-ui';c.fillText('FRAME '+(index+1)+' / 6 · 8 fps · 기준 높이 244',24,30);requestAnimationFrame(draw)}requestAnimationFrame(draw);
</script></html>
