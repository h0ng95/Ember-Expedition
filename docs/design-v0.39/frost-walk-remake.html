<main><div class="tag">IGNIS · FROST WARDEN</div><h1>부유하는 얼음 갑주</h1><p>넓은 어깨와 거대한 주먹, 짧은 몸통. 하체는 얼음 핵과 떠 있는 장갑 조각으로 새로 만들었다.</p><div class="grid"><section class="panel"><h2>캐릭터 원화</h2><img src="../../unity/Assets/Resources/Art/Enemies/v039/frost-boss-floating.png" alt="짧고 넓은 몸통과 거대한 주먹, 얼음 핵으로 부유하는 서리 파수꾼"></section><section class="panel"><h2>게임 축척 · 5전투 보스와 비슷한 덩치</h2><canvas id="c" width="540" height="494"></canvas></section></div><p class="note">높이 290 · 원본 비율 유지 · 바닥에서 10만큼 띄우고 상하 2 이내로 움직인다. 팔이 붙어 있는 전신 4프레임으로 대기 → 준비 → 타격 → 복귀를 재생한다. 팔을 따로 이동·회전시키지 않는다. 어두운 철갑과 남색 천의 원화 재질을 참고해 색감을 보정했다.</p><div class="actions"><button id="play">재생 멈추기</button><button id="mode">일반 공격</button><button id="slow">1× 속도</button><a href="boss-size-comparison.html">여섯 보스 크기 비교</a><a href="HANDOFF.html">개발 기록</a><a href="FROST-FULL-MOTION-PROMPTS.md">제작 프롬프트</a></div></main><script src="frost-full-motion.js"></script><script>

const ctx=document.getElementById('c').getContext('2d');let time=0,last=0,run=true,nova=false,slow=false;
document.getElementById('play').onclick=e=>{run=!run;e.target.textContent=run?'재생 멈추기':'재생하기'};
document.getElementById('mode').onclick=e=>{nova=!nova;time=0;e.target.textContent=nova?'서리 공격':'일반 공격'};
document.getElementById('slow').onclick=e=>{slow=!slow;e.target.textContent=slow?'0.5× 속도':'1× 속도'};
function draw(now){if(run)time+=Math.min(50,now-last)/1000*(slow?.5:1);last=now;ctx.clearRect(0,0,540,494);ctx.fillStyle='#1b2631';ctx.fillRect(0,414,540,80);ctx.fillStyle='#617481';ctx.fillRect(20,416,500,1);const t=time%(nova?3.2:1.8);let f=0;if(nova){if(t>=.7&&t<1.7)f=t<1.15?22:23;else if(t>=1.7&&t<1.88)f=14+Math.min(3,Math.floor((t-1.7)/.045));}else{if(t>=.7&&t<.95)f=t<.825?12:13;else if(t>=.95&&t<1.13)f=14+Math.min(3,Math.floor((t-.95)/.045));}FrostFullMotion.render(ctx,270,414,290,f,time,nova);ctx.fillStyle='#d2e6f0';ctx.font='15px system-ui';ctx.fillText(f>=14&&f<=17?'타격 → 회수':f===12||f===13||f===22||f===23?'공격 준비':'대기 · 부유',22,32);requestAnimationFrame(draw)}requestAnimationFrame(draw);</script></html>
