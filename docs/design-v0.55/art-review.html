<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>v0.55 · 원정대 도트 검수</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111820;color:#ebe7dc;font:16px/1.6 system-ui}header{max-width:1400px;margin:auto;padding:30px 24px 16px}h1{margin:0;font-size:30px}p{color:#bbc6cb}nav{position:sticky;top:0;z-index:3;background:#19232eed;padding:16px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-block:1px solid #40505e}button,select,input{font:inherit}button,select{background:#293c4a;border:1px solid #66818f;color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer}main{max-width:1440px;margin:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}article[hidden]{display:none}article{background:#1b2630;border:1px solid #46535b;border-radius:12px;overflow:hidden}h2{font-size:18px;margin:16px 18px 8px}small{color:#b7c3c9}canvas{display:block;width:100%;image-rendering:pixelated;background:#d9dcdf}article p{font-size:13px;margin:12px 18px}footer{padding:24px;text-align:center}a{color:#e7c37c}.tag{color:#f3cf81}#status{font-size:13px;color:#e9c785}</style>
<header><div class="tag">IGNIS : ASHEN OATH / ART REVIEW 0.55</div><h1>같은 사람 크기, 다른 직업과 성장</h1><p>머리·투구 정수리에서 발바닥까지를 동일하게 맞춥니다. 깃발·무기·깃털·이펙트 높이는 제외합니다. 공격 중에는 크기를 다시 계산하지 않습니다.</p><p>장비 개수와 잡는 손, 공격 전후 복귀를 확인하는 화면입니다. 전체 30형태를 비교합니다. 장비가 누락·중복된 일부 셀은 온전한 전체 자세를 재사용하며 상세 목록은 검수 기록에 남겼습니다.</p></header>
<nav><label>등급 <select id="tier"><option value="all">전체 30종</option><option value="new">이번 18종</option><option value="B">기본</option><option value="E">분기 진화</option><option value="F">최종 진화</option><option value="H">결합</option></select></label><label>보기 <select id="version"><option value="after">수정본</option><option value="before">기존</option></select></label><label>동작 <select id="motion"><option value="cycle">대기 → 공격 → 복귀</option><option value="idle">대기</option><option value="walk">걷기</option><option value="attack">공격</option><option value="hit">피격</option><option value="death">쓰러짐</option><option value="all">전체 22슬롯</option></select></label><button id="pause">일시정지</button><button id="step">한 프레임 →</button><label>배경 <select id="bg"><option value="#ededed">밝은 회색</option><option value="#132a32">짙은 청록</option><option value="#7b5341">흙색</option></select></label><label>크기 <select id="size"><option value="170">확대 · 몸 170px</option><option value="84">전투에 가까운 몸 84px</option></select></label><span id="status"></span></nav>
<main id="grid"></main><footer><a href="HANDOFF.html">작업 기록</a> · <a href="production.json">생성·수정 프롬프트</a> · <a href="body-calibration.json">사람 기준 측정값</a></footer>
<script src="preview-data.js"></script><script>
const seq={idle:[0,1,2,3],walk:[6,7,8,9,10,11],attack:[12,13,14,15,16,17],hit:[4,5],death:[18,19,20,21],all:Array.from({length:22},(_,i)=>i),cycle:[0,1,2,3,0,1,2,3,12,13,14,15,16,17,0,1,2,3]};
const query=new URLSearchParams(location.search),cache=new Map,views=[],statusLabel=document.getElementById('status');let tick=Number(query.get('frame')||0),paused=query.has('frame'),last=0,clipAvailable=true;
if(paused){motion.value='all';pause.textContent='재생';}
async function load(e){let key=e.resourcePath;if(cache.has(key))return cache.get(key);let img=new Image();img.src='../../unity/Assets/Resources/'+key+'.png';await img.decode();let c=document.createElement('canvas');c.width=img.width;c.height=img.height;let ctx=c.getContext('2d');ctx.drawImage(img,0,0);try{let d=ctx.getImageData(0,0,c.width,c.height);for(let i=3;i<d.data.length;i+=4)if(d.data[i]<34)d.data[i]=0;ctx.putImageData(d,0,0);}catch(err){clipAvailable=false;}cache.set(key,c);return c;}
for(const r of ART_REVIEW.filter(r=>!query.has('unit')||query.get('unit').split(',').includes(r.id))){let a=document.createElement('article');a.innerHTML='<h2>'+r.name+' <small>'+r.id+'</small></h2><canvas width="440" height="350"></canvas><p>사람 높이 고정 · 무기/깃발 제외<br><span class="frame"></span></p>';a.dataset.id=r.id;a.dataset.new=String(r.after.resourcePath.includes("/v055/"));grid.appendChild(a);views.push({r,c:a.querySelector('canvas'),label:a.querySelector('.frame')});}
function draw(){let mode=motion.value,ver=version.value,arr=seq[mode],index=arr[tick%arr.length],body=Number(size.value);for(const v of views){let e=v.r[ver],img=cache.get(e.resourcePath);if(!img)continue;let f=e.frames[index],ctx=v.c.getContext('2d'),s=body/(ver==='after'?v.r.height:v.r.oldHeight),ground=310;ctx.fillStyle=bg.value;ctx.fillRect(0,0,440,350);ctx.strokeStyle='#969b9a';ctx.setLineDash([4,5]);for(let y of [ground,ground-body]){ctx.beginPath();ctx.moveTo(16,y+.5);ctx.lineTo(424,y+.5);ctx.stroke();}ctx.imageSmoothingEnabled=false;let dx=220-f.pivotX*f.width*s,dy=ground-(1-f.pivotY)*f.height*s;for(const r of (f.regions||[{x:0,y:0,width:f.width,height:f.height}]))ctx.drawImage(img,f.x+r.x,e.height-f.y-f.height+r.y,r.width,r.height,Math.round(dx+r.x*s),Math.round(dy+r.y*s),Math.round(dx+(r.x+r.width)*s)-Math.round(dx+r.x*s),Math.round(dy+(r.y+r.height)*s)-Math.round(dy+r.y*s));v.label.textContent=mode+' / 슬롯 '+index+' / 몸 '+body+'px';}statusLabel.textContent=clipAvailable?'빛 효과 유지 · 이웃 프레임 분리 · 게임 알파 적용':'파일 직접 열기: 원본 알파 표시 (게임은 미세 잔광 제거)';}
tier.onchange=()=>{for(const a of document.querySelectorAll('article'))a.hidden=!(tier.value==='all'||(tier.value==='new'?a.dataset.new==='true':a.dataset.id.startsWith(tier.value+'-')));};pause.onclick=()=>{paused=!paused;pause.textContent=paused?'재생':'일시정지'};step.onclick=()=>{paused=true;pause.textContent='재생';tick++;draw()};for(let el of [motion,version,bg,size])el.onchange=()=>{tick=0;draw()};
Promise.all(ART_REVIEW.flatMap(r=>[load(r.before),load(r.after)])).then(()=>{draw();requestAnimationFrame(function loop(t){if(t-last>170){if(!paused)tick++;last=t;draw()}requestAnimationFrame(loop)})}).catch(e=>statusLabel.textContent='이미지 로드 실패: '+e.message);
</script></html>
