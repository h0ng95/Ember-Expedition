<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IGNIS · 무기별 공격 효과</title>
<style>*{box-sizing:border-box}body{margin:0;background:#131b20;color:#ece7d9;font:16px/1.65 system-ui,sans-serif}main{max-width:1200px;margin:auto;padding:32px 24px 64px}.eyebrow{color:#d8b87b;letter-spacing:.12em;font-size:13px}h1{font-size:32px;margin:8px 0}p{color:#b9c4c6}a{color:#efc986}.controls{position:sticky;top:0;z-index:2;padding:14px;background:#223037f5;border:1px solid #506065;display:flex;gap:16px;flex-wrap:wrap;align-items:center;border-radius:8px}button,select{font:inherit;background:#31444a;color:#efe6d6;border:1px solid #827758;padding:5px 10px;border-radius:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:24px}article{background:#1c292f;border:1px solid #415057;border-radius:8px;overflow:hidden}h2{font-size:18px;margin:14px 16px 4px}article p{font-size:13px;margin:0 16px 14px;min-height:43px}canvas{width:100%;display:block;image-rendering:pixelated}.notice{font-size:13px}#state{font-size:12px;color:#b8c5ba}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.grid{grid-template-columns:1fr}}</style>
<main><div class="eyebrow">IGNIS: ASHEN OATH / COMBAT FX 0.71</div><h1>무기에 맞게 날아가고, 맞는 순간 터지게.</h1><p>검·망치·화살·마법의 접촉을 구분했습니다. 같은 런타임 시트를 보는 표현 검토용 화면입니다.<br>실제 전투에서는 게임의 투사체 비행과 피해 이벤트에 연결됩니다.</p>
<div class="controls"><button id="pause">일시정지</button><label>속도 <select id="speed"><option value="1">1×</option><option value="2">2×</option><option value=".35">느리게 보기</option></select></label><label>방향 <select id="direction"><option value="1">아군 → 적</option><option value="-1">적 → 아군</option></select></label><label>배경 <select id="bg"><option value="dark">어두움</option><option value="light">밝음</option></select></label><label><input id="reduced" type="checkbox"> 섬광·모션 줄이기</label><span id="state">시트 불러오는 중</span></div><div class="grid" id="grid"></div>
<p class="notice">보스 공격의 범위·피해 수치·용의 브레스 경로는 유지합니다. 입자와 파편은 기존 예고 범위 안에 추가했습니다. 왼쪽 아군 목록의 공격 깜빡임도 계속 제거된 상태입니다. <a href="HANDOFF.html">적용 및 실기기 검증</a> · <a href="../design-v0.70/effects-preview.html">회복·빙결 보기</a></p></main>
<script>
const base='../../unity/Assets/Resources/Art/Effects/',images={},sheets={
 'arrow':[112,32,92,16,.6],firebolt:[136,56,112,28,1.2],icebolt:[176,64,146,32,.8],holybolt:[64,32,48,16,1],venombolt:[64,32,48,16,1],stone:[64,32,48,16,1],
 'blunt-hit':[128,96,64,48,.25],'pierce-hit':[80,80,40,40,.22],'ice-hit':[80,80,40,40,.28],'holy-hit':[80,80,40,40,.25],'venom-hit':[80,80,40,40,.25],'fire-hit':[80,96,40,58,.28],'claw-hit':[80,80,40,40,.2],'shield-block':[80,80,40,40,.25],'ground-contact':[80,48,40,28,.32],'ground-charge':[80,48,40,28,1],'sword-hit':[144,128,72,64,.24]};
const cards=[['화살','화살촉과 깃털을 유지하고, 명중점에 작은 파편.','arrow','pierce-hit',.95],['화염탄','작은 화구 뒤로 불티가 흐르고, 접촉 지점에서 확산.','firebolt','fire-hit',.9],['얼음탄','회청색 얼음 창과 짧은 결정 파편.','icebolt','ice-hit',.7],['성광탄','성직자의 금빛 마법과 별 모양 접촉.','holybolt','holy-hit',1.4],['독성탄','정원 적의 녹색 마법. 화살과 구분.','venombolt','venom-hit',1.4],['돌 투사체','폐광 원거리 적의 작은 돌과 충격 먼지.','stone','blunt-hit',1.4],['검 / 망치','검은 절삭 궤적, 망치·방패는 충격과 먼지.','melee','blunt-hit',1],['발톱 / 보호막','야수의 세 갈래 발톱과 보호막 흡수 표시.','melee','shield-block',1],['보스 예고 / 착탄','경계는 유지하고 안쪽으로 입자, 타격 때 파편.','ground','ground-contact',1]];
for(const [name,desc] of cards){let a=document.createElement('article');a.innerHTML=`<h2>${name}</h2><p>${desc}</p><canvas width="450" height="210"></canvas>`;grid.append(a)}
let time=0,last=0,paused=false;const query=new URLSearchParams(location.search);if(query.has('time')){time=Number(query.get('time'));paused=true;pause.textContent='재생'}
pause.onclick=()=>{paused=!paused;pause.textContent=paused?'재생':'일시정지'};
function sheet(c,id,x,y,scale,p,flip=false,crop=0){let [w,h,px,py]=sheets[id],f=Math.max(0,Math.min(7,Math.floor(p*8)));c.save();c.translate(x,y);if(flip)c.scale(-1,1);c.globalAlpha=reduced.checked?.65:1;c.drawImage(images[id],f%4*w+crop,Math.floor(f/4)*h,w-crop,h,(crop-px)*scale,-py*scale,(w-crop)*scale,h*scale);c.restore()}
function body(c,x){c.fillStyle='#00000038';c.beginPath();c.ellipse(x,181,27,7,0,0,Math.PI*2);c.fill();c.drawImage(images.unit,59,72,147,178,x-45,64,95,116)}
function draw(){document.querySelectorAll('canvas').forEach((canvas,i)=>{const c=canvas.getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle=bg.value==='dark'?'#17282d':'#d8d9d2';c.fillRect(0,0,450,210);c.fillStyle=bg.value==='dark'?'#293b38':'#bbc5b8';c.fillRect(0,178,450,32);let age=time%1.5,flip=direction.value==='-1',x=flip?75:365,from=flip?365:75;let [name,desc,projectile,hit,scale]=cards[i];
 if(projectile==='ground'){c.strokeStyle='#db9c4c';c.lineWidth=2;c.beginPath();c.ellipse(225,158,95,49,0,0,Math.PI*2);c.stroke();if(age<.85)sheet(c,'ground-charge',225,158,2.1,reduced.checked?.4:(age*1.5)%1);else if(age<1.17)sheet(c,'ground-contact',225,158,2.1,(age-.85)/.32);return;}
 if(projectile==='melee'){body(c,140);body(c,320);let p=age-.45;if(p>=0){if(i===6){if(p<.24)sheet(c,'sword-hit',140,120,1,p/.24,flip);if(p<.25)sheet(c,'blunt-hit',320,120,1.25,p/.25,flip)}else{if(p<.2)sheet(c,'claw-hit',140,120,1.35,p/.2,flip);if(p<.25)sheet(c,'shield-block',320,120,1.2,p/.25,flip)}}return;}
 body(c,x);let launch=.3,flight=.18;if(age>=launch&&age<launch+flight){let p=(age-launch)/flight,px=from+(x-from)*p,[w,h,pivot,y,duration]=sheets[projectile],tail=290*p/scale;if(reduced.checked)tail=Math.min(tail,projectile==='arrow'?48:20);sheet(c,projectile,px,120,scale,reduced.checked?.25:(time/duration)%1,flip,Math.max(0,pivot-tail));}let after=age-launch-flight;if(after>=0&&after<sheets[hit][4])sheet(c,hit,x,120,hit==='blunt-hit'?1.25:1.35,after/sheets[hit][4],flip);
 })}
Promise.all([...Object.keys(sheets).map(async id=>{let img=new Image;img.src=base+(id==='sword-hit'?'v070/':'v071/')+id+'.png';await img.decode();images[id]=img}), (async()=>{let img=new Image;img.src='../../unity/Assets/Resources/Art/Units/v010/B-KN.png';await img.decode();images.unit=img})()]).then(()=>{state.textContent='16종 신규 시트 · 실제 캐릭터 크기';requestAnimationFrame(function loop(now){if(last&&!paused)time+=Math.min(.1,(now-last)/1000)*Number(speed.value);last=now;draw();requestAnimationFrame(loop)})}).catch(e=>state.textContent='로드 오류: '+e.message);
</script></html>
